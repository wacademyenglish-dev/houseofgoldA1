<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOLF LABS | House of Gold (A1)</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind Config for Spotify Theme -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        spotify: {
                            base: '#121212',
                            surface: '#181818',
                            elevated: '#282828',
                            green: '#1DB954',
                            greenHover: '#1ed760',
                            text: '#FFFFFF',
                            subtext: '#B3B3B3'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #121212;
            color: #FFFFFF;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        /* Ambient Orbs */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.15;
            animation: float 15s infinite ease-in-out alternate;
        }
        .orb-1 { top: -10%; left: -10%; width: 60vw; height: 60vw; background-color: #1DB954; }
        .orb-2 { bottom: -10%; right: -10%; width: 70vw; height: 70vw; background-color: #EAB308; animation-delay: -4s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.05); }
        }

        /* Abstract Background Lines */
        .bg-lines {
            position: fixed; inset: 0; z-index: -2; opacity: 0.05;
            background-image: linear-gradient(#1DB954 1px, transparent 1px), linear-gradient(90deg, #1DB954 1px, transparent 1px);
            background-size: 80px 80px;
            transform: perspective(500px) rotateX(60deg) scale(2.5);
            transform-origin: top;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .glass-card {
            background: rgba(24, 24, 24, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.02);
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-red { animation: pulseRed 0.4s ease-out; }
        @keyframes pulseRed { 0% { background-color: rgba(239, 68, 68, 0.3); } 100% { background-color: transparent; } }

        .pulse-green { animation: pulseGreen 0.4s ease-out; }
        @keyframes pulseGreen { 0% { background-color: rgba(29, 185, 84, 0.3); } 100% { background-color: transparent; } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1DB954; border-radius: 10px; }

        /* Word Chips (Lyric Builder) */
        .word-chip { 
            cursor: pointer; touch-action: manipulation; 
            border-radius: 500px !important; background-color: #1DB954 !important; color: #000 !important; font-weight: 800 !important;
            border: 1px solid rgba(255,255,255,0.2) !important; box-shadow: 0 4px 15px rgba(29,185,84,0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .word-chip:active { transform: scale(0.92); opacity: 0.9; box-shadow: 0 2px 5px rgba(29,185,84,0.5); }
        .word-chip.selected { box-shadow: 0 0 0 4px rgba(255,255,255,0.3), 0 0 20px rgba(29,185,84,0.8); transform: scale(1.05); }

        /* Drop Zones */
        .drop-zone {
            border: 2px dashed rgba(29, 185, 84, 0.3) !important;
            background: rgba(0,0,0,0.3) !important;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .drop-zone.filled {
            border-style: solid !important;
            border-color: rgba(29, 185, 84, 0.6) !important;
            background: rgba(29, 185, 84, 0.05) !important;
        }

        /* Epic Start Button */
        .btn-start-epic {
            position: relative;
            background: rgba(29, 185, 84, 0.1);
            border: 1px solid #1DB954;
            color: #1DB954;
            text-transform: uppercase;
            letter-spacing: 2px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(29, 185, 84, 0.2), inset 0 0 15px rgba(29, 185, 84, 0.1);
        }
        .btn-start-epic:hover {
            background: #1DB954;
            color: #000;
            box-shadow: 0 15px 40px rgba(29, 185, 84, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px) scale(1.02);
        }
        .btn-start-epic:active { transform: scale(0.96); }

        /* Sync Lyrics */
        .lyric-line { transition: all 0.2s; cursor: pointer; opacity: 0.4; }
        .lyric-line:hover { opacity: 1; color: #FFFFFF; transform: translateX(10px); }
        .lyric-active { opacity: 1; color: #1DB954; font-weight: 800; transform: scale(1.05) translateX(10px); border-left-color: #1DB954 !important; }

        /* Safe Scrolling Wrapper (Prevents Cut-offs) */
        .safe-scroll-wrapper {
            min-height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        
        /* Interactive Reveal Panel (New Vocab Design) */
        .reveal-panel {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen text-spotify-text text-sm">

    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="bg-lines"></div>

    <div class="fixed inset-0 z-[-1] pointer-events-none overflow-hidden opacity-[0.03]">
        <i data-lucide="music" class="absolute top-[15%] left-[10%] w-24 h-24 text-white transform -rotate-12"></i>
        <i data-lucide="headphones" class="absolute top-[65%] right-[15%] w-32 h-32 text-spotify-green transform rotate-45"></i>
    </div>

    <!-- TOP NAV -->
    <header class="glass fixed top-0 w-full z-50 h-16 flex items-center justify-between px-4 md:px-6">
        <div class="flex items-center gap-3">
            <button onclick="app.goHome()" class="text-white/60 hover:text-white transition rounded-full p-2 bg-white/5 hover:bg-white/10">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <div class="flex items-center gap-2 ml-2">
                <div class="w-8 h-8 rounded-full bg-spotify-green flex items-center justify-center">
                    <i data-lucide="music" class="text-black w-4 h-4"></i>
                </div>
                <span class="font-black tracking-widest text-sm md:text-base">WOLF <span class="text-spotify-green">LABS</span></span>
            </div>
        </div>
        
        <!-- Status Bar -->
        <div id="status-bar" class="hidden items-center gap-3 md:gap-5 bg-black/40 px-4 py-1.5 rounded-full border border-white/10 backdrop-blur-md shadow-lg">
            <div class="flex items-center gap-1.5">
                <i data-lucide="heart" class="text-red-500 w-4 h-4 fill-red-500"></i>
                <span id="hp-display" class="font-bold text-xs md:text-sm text-white">100 HP</span>
            </div>
            <div class="w-px h-4 bg-white/20"></div>
            <div class="flex items-center gap-1.5">
                <i data-lucide="zap" class="text-spotify-green w-4 h-4 fill-spotify-green"></i>
                <span id="xp-display" class="font-bold text-xs md:text-sm text-white">0 XP</span>
            </div>
        </div>

        <button onclick="app.toggleFullscreen()" class="text-white/60 hover:text-white p-2 bg-white/5 rounded-full transition hover:bg-white/10">
            <i data-lucide="maximize" id="fs-icon" class="w-5 h-5"></i>
        </button>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main id="main-container" class="flex-1 mt-16 mb-24 overflow-y-auto overflow-x-hidden relative w-full">
        <!-- Dynamic Content Injected Here -->
    </main>

    <!-- NAVIGATION BAR (BOTTOM) -->
    <footer class="glass fixed bottom-0 w-full h-20 md:h-24 flex items-center justify-between px-4 md:px-8 z-50">
        <!-- Track Info -->
        <div class="flex items-center gap-3 w-1/4 min-w-[100px]">
            <div class="w-10 h-10 md:w-14 md:h-14 rounded-lg shadow-2xl overflow-hidden relative border border-white/10 shrink-0 hidden sm:block">
                <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover opacity-60" alt="Album Art">
            </div>
            <div class="flex flex-col min-w-0">
                <span class="font-black text-white text-xs md:text-sm truncate tracking-tight" id="player-title">House of Gold</span>
                <span class="text-[9px] md:text-[11px] text-spotify-green truncate font-bold uppercase tracking-widest mt-0.5" id="player-artist">Twenty One Pilots • A1</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-center gap-6 md:gap-10 w-2/4">
            <button onclick="app.prevSlide()" class="text-white/40 hover:text-white transition bg-white/5 p-3 md:p-4 rounded-full hover:bg-white/10 hover:scale-110 active:scale-95" id="btn-prev">
                <i data-lucide="arrow-left" class="w-5 h-5 md:w-6 md:h-6"></i>
            </button>
            <button onclick="app.togglePlay()" class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-spotify-green text-black flex items-center justify-center hover:scale-105 hover:bg-spotify-greenHover transition transform shadow-[0_0_20px_rgba(29,185,84,0.4)] shrink-0">
                <i data-lucide="play" class="w-5 h-5 md:w-6 md:h-6 fill-current ml-1" id="play-icon"></i>
            </button>
            <button onclick="app.nextSlide()" class="text-white/40 hover:text-white transition bg-white/5 p-3 md:p-4 rounded-full hover:bg-white/10 hover:scale-110 active:scale-95" id="btn-next">
                <i data-lucide="arrow-right" class="w-5 h-5 md:w-6 md:h-6"></i>
            </button>
        </div>

        <!-- Progress -->
        <div class="flex items-center justify-end w-1/4 gap-3 md:gap-4">
            <div class="flex flex-col items-end gap-1.5 w-full">
                <div class="flex items-center justify-end w-full gap-1 text-[10px] md:text-xs font-black text-white/50 tracking-widest">
                    <span id="progress-current" class="text-white">0</span>
                    <span>/</span>
                    <span id="progress-total">0</span>
                </div>
                <div class="h-1.5 md:h-2 w-16 md:w-32 bg-white/10 rounded-full overflow-hidden relative shadow-inner">
                    <div id="progress-bar-fill" class="h-full bg-spotify-green transition-all duration-300 w-0 relative shadow-[0_0_10px_rgba(29,185,84,0.8)]"></div>
                </div>
            </div>
        </div>
    </footer>

    <!-- LOGIC & DATA -->
    <script>
        // --- DATA DOMAIN (24 SLIDES - 1 HOUR CLASS - HOUSE OF GOLD) ---
        const lessonData = [
            { type: 'bCover', title: 'House of Gold', subtitle: 'Twenty One Pilots | UNIT 5: Family & Future (A1)', tags: ['A1 Beginner', 'Future with WILL', 'Family', 'Promises'] },
            { type: 'bSoundcheck', emoji: '👨‍👩‍👦', title: 'Vibe Check', question: 'How important is family to you?', speakingStarter: 'To me, family is...' },
            { type: 'bSoundcheck', emoji: '💰', title: 'Vibe Check', question: 'If you had a million dollars, what would you buy?', speakingStarter: 'If I had a lot of money, I would buy...' },
            
            // NEW Concept Reveal (Replaces the 3D flip cards for better interaction)
            { type: 'bConceptReveal', title: 'Lyric Decryption', words: [
                { word: 'Gold', icon: 'coins', def: 'A yellow precious metal, very expensive.', q: 'Do you like to wear gold?', start: 'I (like/don\'t like) to wear gold because...' },
                { word: 'Queen', icon: 'crown', def: 'The female ruler of a country.', q: 'Who is the queen of your house?', start: 'In my house, the queen is...' },
                { word: 'Cure', icon: 'activity', def: 'Medicine that makes a sick person healthy.', q: 'What is the best cure for a cold?', start: 'The best cure for a cold is...' }
            ]},
            
            { type: 'bSoundcheck', emoji: '📺', title: 'Pre-Watch', question: 'What is the weirdest music video you have ever seen?', speakingStarter: 'The weirdest video I know is...' },
            { type: 'bPreWatch', title: 'The Visual Vibe', task: 'This video is very strange. Half of their bodies are missing! Just watch and try to understand the vibe.', speakingStarter: 'I expect this video to be...' },
            { type: 'bRhythmCheck', question: 'Prediction: Where are they playing the song in the video?', options: ['In a big city', 'On a farm', 'On the moon', 'In a studio'], correct: 1, successMsg: 'Good guess! Let\'s see if you are right.', speakingStarter: 'I chose this option because...' },
            
            { type: 'bVideo', title: 'Song Play: Official Video', url: 'https://www.youtube.com/embed/mDyxykpYeu8?autoplay=0', task: 'Watch the video. Pay attention to the singer\'s legs.' },
            
            { type: 'bSoundcheck', emoji: '🎬', title: 'Post-Watch', question: 'What was your first reaction to the video?', speakingStarter: 'When I saw the video, I felt...' },
            { type: 'bSoundcheck', emoji: '🎸', title: 'Post-Watch', question: 'Did you like the sound of the ukulele?', speakingStarter: 'I think the ukulele sounds...' },
            
            { type: 'bLyricsSync', title: 'The Promises', lyrics: [
                { text: "I will make you queen of everything you see.", focus: "Making a big promise", hook: "He promises to give her the world.", starter: "I would make my mother..." },
                { text: "I will buy you a house of gold.", focus: "Will + Buy", hook: "Using WILL for a future decision.", starter: "I think a house of gold is..." },
                { text: "And when your father turns to stone...", focus: "Getting old", hook: "A metaphor for dying or becoming old.", starter: "I am (not) afraid of getting older because..." },
                { text: "I will take care of you.", focus: "Will + Take care", hook: "Promising to protect someone.", starter: "The person who takes care of me is..." }
            ]},
            
            { type: 'bLogicGrammar', title: 'Grammar Beats: The Future (WILL)', rules: [
                { rule: 'WILL for Promises', desc: 'Use WILL when you promise to do something in the future. "I will buy you a car."' },
                { rule: 'WILL for Decisions', desc: 'Use WILL for a quick decision made at the moment. "I will help you!"' }
            ]},
            
            { type: 'bRhythmCheck', question: 'Which sentence is a promise?', options: ['I go to school everyday.', 'I will always love you.', 'I am eating pizza.', 'I have a dog.'], correct: 1, successMsg: 'Perfect! That is a classic promise.', speakingStarter: 'Read the correct sentence with emotion.' },
            { type: 'bRhythmCheck', question: 'What is the negative form of WILL?', options: ['Won\'t (Will not)', 'Don\'t will', 'Am not will', 'Doesn\'t will'], correct: 0, successMsg: 'Correct! "I won\'t do that."', speakingStarter: 'Give me one sentence using WON\'T.' },
            
            { type: 'bCategorization', title: 'Lyric Builder', items: ['I will', 'buy you', 'a house', 'of gold'], buckets: ['The Action (Verb)', 'The Object (Gift)'], mapping: [0, 0, 1, 1] },
            { type: 'bCategorization', title: 'Lyric Builder II', items: ['I', 'will', 'make you', 'queen'], buckets: ['Subject & Future', 'Action & Object'], mapping: [0, 0, 1, 1] },
            
            { type: 'bEarTraining', title: 'Ear Training', instructions: 'Click the word that Tyler DID NOT sing in this line.', lyric: ['I', 'must', 'take', 'care', 'of', 'you'], actualWords: ['I', 'will', 'take', 'care', 'of', 'you'], wrongWordIndex: 1, successMsg: 'Perfect! He sings "I WILL take care of you".', speakingStarter: 'Why does he use WILL here?' },
            { type: 'bEarTraining', title: 'Ear Training Part II', instructions: 'Find the intruder word in this verse.', lyric: ['I', 'will', 'make', 'you', 'king'], actualWords: ['I', 'will', 'make', 'you', 'queen'], wrongWordIndex: 4, successMsg: 'Nailed it! "I will make you QUEEN".', speakingStarter: 'What is the difference between King and Queen?' },
            
            // Second Concept Reveal
            { type: 'bConceptReveal', title: 'Deeper Themes', words: [
                { word: 'Take care', icon: 'heart', def: 'To protect someone and provide what they need.', q: 'Do you take care of a pet?', start: 'I take care of...' },
                { word: 'Disease', icon: 'activity', def: 'An illness or sickness.', q: 'What do you do when you have a disease (like a cold)?', start: 'When I am sick, I...' },
                { word: 'Pretend', icon: 'mask', def: 'To act like something is true when it is not.', q: 'Do you ever pretend to be okay?', start: 'Sometimes I pretend...' }
            ]},
            
            { type: 'bDecisionStand', title: 'The Arena', question: 'Is money (a house of gold) the best way to show love?', labels: ['No, love is free', 'Yes, gifts are love'] },
            { type: 'bDecisionStand', title: 'The Arena', question: 'Who should take care of parents when they get old?', labels: ['The Children', 'The Government'] },
            { type: 'bSoundcheck', emoji: '🤝', title: 'Debate', question: 'Do you always keep your promises?', speakingStarter: 'I (always/sometimes) keep my promises because...' },
            { type: 'bSoundcheck', emoji: '📝', title: 'Debate', question: 'If you wrote a song for your family, what would it be about?', speakingStarter: 'My song would be about...' },
            
            { type: 'bWrap', title: 'Mission Clear', msg: 'You have mastered the future with WILL and family vocabulary in English!' }
        ];

        const app = {
            currentIndex: -1, hp: 100, xp: 0, trackData: lessonData, isPlaying: false,
            init() { this.renderDashboard(); lucide.createIcons(); },
            loadLevel() { this.currentIndex = 0; document.getElementById('status-bar').classList.replace('hidden', 'flex'); this.renderSlide(); },
            goHome() { this.currentIndex = -1; document.getElementById('status-bar').classList.replace('flex', 'hidden'); this.renderDashboard(); },
            updateStatus() {
                document.getElementById('hp-display').innerText = `${this.hp} HP`;
                document.getElementById('xp-display').innerText = `${this.xp} XP`;
                const progress = (this.currentIndex / (this.trackData.length - 1)) * 100;
                document.getElementById('progress-bar-fill').style.width = `${progress}%`;
                document.getElementById('progress-current').innerText = this.currentIndex;
                document.getElementById('progress-total').innerText = this.trackData.length - 1;
            },
            takeDamage(a) { this.hp = Math.max(0, this.hp - a); this.updateStatus(); document.getElementById('main-container').classList.add('pulse-red'); setTimeout(() => document.getElementById('main-container').classList.remove('pulse-red'), 400); },
            gainXP(a) { this.xp += a; this.updateStatus(); document.getElementById('main-container').classList.add('pulse-green'); setTimeout(() => document.getElementById('main-container').classList.remove('pulse-green'), 400); },
            nextSlide() { if (this.currentIndex >= 0 && this.currentIndex < this.trackData.length - 1) { this.currentIndex++; this.renderSlide(); } },
            prevSlide() { if (this.currentIndex > 0) { this.currentIndex--; this.renderSlide(); } },
            togglePlay() {
                this.isPlaying = !this.isPlaying;
                const icon = document.getElementById('play-icon');
                if (icon) {
                    icon.setAttribute('data-lucide', this.isPlaying ? 'pause' : 'play');
                    icon.classList.toggle('ml-1', !this.isPlaying);
                }
                lucide.createIcons();
            },
            toggleFullscreen() { const e = document.documentElement; const i = document.getElementById('fs-icon'); if (!document.fullscreenElement) { e.requestFullscreen?.() || e.webkitRequestFullscreen?.() || e.msRequestFullscreen?.(); if(i) i.setAttribute('data-lucide', 'minimize'); } else { document.exitFullscreen?.() || document.webkitExitFullscreen?.() || document.msExitFullscreen?.(); if(i) i.setAttribute('data-lucide', 'maximize'); } lucide.createIcons(); },
            
            renderDashboard() {
                document.getElementById('main-container').innerHTML = `
                    <div class="safe-scroll-wrapper">
                        <div class="fade-in flex flex-col items-center text-center p-4 w-full max-w-2xl mx-auto">
                            <div class="relative mb-8 group">
                                <div class="absolute inset-0 bg-spotify-green rounded-full blur-[80px] opacity-30 group-hover:opacity-50 transition duration-700"></div>
                                <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=800&auto=format&fit=crop" onerror="this.src='https://images.unsplash.com/photo-1493225457124-a1a2a5956093?q=80&w=800&auto=format&fit=crop'" class="w-40 h-40 md:w-48 md:h-48 object-cover rounded-full border-[6px] border-spotify-green relative z-10 shadow-[0_0_50px_rgba(29,185,84,0.6)] bg-[#181818]">
                            </div>
                            <h1 class="text-4xl md:text-6xl font-black mb-2 uppercase tracking-tighter text-white drop-shadow-md">WOLF <span class="text-spotify-green">LABS</span></h1>
                            <p class="text-white/60 mb-10 text-sm md:text-base font-medium tracking-widest uppercase">UNIT 5: FAMILY & FUTURE (A1)</p>
                            
                            <div class="glass-card w-full rounded-3xl p-6 md:p-10 flex flex-col relative border border-white/10 shadow-2xl">
                                <div class="text-left mb-8">
                                    <h2 class="text-2xl md:text-3xl font-black text-white mb-2">House of Gold</h2>
                                    <p class="text-spotify-green font-black text-xs uppercase tracking-widest mb-6">Twenty One Pilots</p>
                                    
                                    <div class="flex flex-wrap gap-2.5">
                                        <span class="bg-spotify-green/20 text-spotify-green px-4 py-2 rounded-full border border-spotify-green/30 text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5 shadow-sm">
                                            <i data-lucide="bar-chart" class="w-3 h-3"></i> Nível A1
                                        </span>
                                        <span class="bg-white/5 text-white/90 px-4 py-2 rounded-full border border-white/10 text-[10px] font-bold tracking-wider flex items-center gap-1.5 shadow-sm">
                                            <i data-lucide="clock" class="w-3 h-3"></i> Future: WILL
                                        </span>
                                        <span class="bg-white/5 text-white/90 px-4 py-2 rounded-full border border-white/10 text-[10px] font-bold tracking-wider flex items-center gap-1.5 shadow-sm">
                                            <i data-lucide="users" class="w-3 h-3"></i> Family
                                        </span>
                                    </div>
                                </div>
                                <button onclick="app.loadLevel()" class="btn-start-epic px-6 py-5 rounded-2xl font-black text-lg w-full flex items-center justify-center gap-3">
                                    <i data-lucide="play" class="w-5 h-5 fill-current"></i> START SESSION
                                </button>
                            </div>
                        </div>
                    </div>`;
                lucide.createIcons();
            },
            
            renderSlide() {
                this.updateStatus();
                const s = this.trackData[this.currentIndex];
                let h = '';
                
                switch(s.type) {
                    case 'bGuide': 
                    case 'bCover':
                        h = `
                        <div class="text-center w-full max-w-xl mx-auto flex flex-col items-center px-4">

                        </div>
                    </div>
                `;
                
                if(s.speakingStarter) {
                    const existing = document.getElementById('speaking-starter-container');
                    if(existing) existing.remove();
                    
                    document.body.insertAdjacentHTML('beforeend', `
                    <div id="speaking-starter-container" class="fixed bottom-20 md:bottom-28 left-1/2 transform -translate-x-1/2 w-[95%] max-w-4xl z-40 fade-in pointer-events-none">
                        <div class="glass-card p-4 md:p-6 rounded-2xl flex flex-col md:flex-row items-start md:items-center gap-4 shadow-[0_20px_40px_rgba(0,0,0,0.8)] border-l-4 border-l-spotify-green pointer-events-auto">
                            <div class="flex items-center gap-2 bg-spotify-green text-black px-3 py-1 rounded-full shrink-0">
                                <i data-lucide="mic" class="w-3 h-3 md:w-4 md:h-4"></i>
                                <span class="font-black text-[10px] md:text-xs uppercase tracking-widest">Speaking Hub</span>
                            </div>
                            <p class="text-sm md:text-base font-bold text-white leading-snug flex-1">${s.speakingStarter}</p>
                        </div>
                    </div>`);
                } else {
                    const existing = document.getElementById('speaking-starter-container');
                    if(existing) existing.remove();
                }

                lucide.createIcons();
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
